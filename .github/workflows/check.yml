name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Type, lint, regression, and production checks
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm run install:ci
      - run: npm run security:audit
      - run: npm run check
      - run: npm run size:report -- --check

  browser:
    name: Browser regression checks (${{ matrix.engine }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            os: windows-latest
          - engine: firefox
            os: ubuntu-latest
          - engine: webkit
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm run install:ci
      - run: node node_modules/@playwright/test/cli.js install --with-deps ${{ matrix.engine }}
      - run: npm run test:browser -- --project=${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures-${{ matrix.engine }}
          path: outputs/browser/
          retention-days: 7
