name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Type, lint, regression, and production checks
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm run install:ci
      - run: npm run security:audit
      - run: npm run check

  browser:
    name: Two-account browser regression checks
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm run install:ci
      - run: node node_modules/@playwright/test/cli.js install chromium --only-shell
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: outputs/browser/
          retention-days: 7
